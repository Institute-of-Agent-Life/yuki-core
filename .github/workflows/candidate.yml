name: Candidate host
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install the locked toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          cargo fetch --locked
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - run: python ci/check.py CORE-039 --out artifacts/CORE-039/ci
      - run: python ci/candidate_job.py native --manifest artifacts/CORE-039/ci/manifest.json --out artifacts/host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/host/
          if-no-files-found: error
  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python ci/candidate_job.py oci --out artifacts/linux-oci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-${{ github.sha }}-linux
          path: |
            artifacts/linux-oci/*.oci.tar
            artifacts/linux-oci/oci-candidate.json*
            artifacts/linux-oci/signer.pub
            artifacts/linux-oci/runtime.log
            artifacts/linux-oci/verify*.py
          if-no-files-found: error
