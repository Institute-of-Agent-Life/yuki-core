name: Candidate host
on:
  workflow_dispatch:
    inputs:
      participation_revision:
        description: Exact source SHA for the Windows participation candidate
        type: string
        default: ''
      participation_consumer:
        description: Exact extensions SHA for replay of an existing candidate
        type: string
        default: ''
      candidate_artifact:
        description: GitHub artifact ID from the selected Windows build
        type: string
        default: ''
      candidate_sha256:
        description: SHA-256 of the selected Windows artifact ZIP
        type: string
        default: ''
      previous_consumers:
        description: Replay the original released consumers against the candidate
        type: boolean
        default: false
      self_opportunities:
        description: Select the SELF protocol additions over released Plugin Base 1.3
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: inputs.participation_revision == '' && inputs.participation_consumer == '' && inputs.candidate_artifact == '' && inputs.candidate_sha256 == '' && !inputs.previous_consumers && !inputs.self_opportunities
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install the locked toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          cargo fetch --locked
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - run: python ci/check.py CORE-039 --out artifacts/CORE-039/ci
      - run: python ci/candidate_job.py native --manifest artifacts/CORE-039/ci/manifest.json --out artifacts/host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/host/
          if-no-files-found: error
  oci:
    if: inputs.participation_revision == '' && inputs.participation_consumer == '' && inputs.candidate_artifact == '' && inputs.candidate_sha256 == '' && !inputs.previous_consumers && !inputs.self_opportunities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python ci/candidate_job.py oci --out artifacts/linux-oci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-${{ github.sha }}-linux
          path: |
            artifacts/linux-oci/*.oci.tar
            artifacts/linux-oci/oci-candidate.json*
            artifacts/linux-oci/signer.pub
            artifacts/linux-oci/runtime.log
            artifacts/linux-oci/verify*.py
          if-no-files-found: error
  selected-windows:
    if: inputs.participation_revision != '' || inputs.participation_consumer != '' || inputs.candidate_artifact != '' || inputs.candidate_sha256 != '' || inputs.previous_consumers || inputs.self_opportunities
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_INCREMENTAL: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
    steps:
      - name: Require a full source SHA
        env:
          REVISION: ${{ inputs.participation_revision }}
          CONSUMER: ${{ inputs.participation_consumer }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          PREVIOUS: ${{ inputs.previous_consumers }}
        run: |
          if ($env:REVISION -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected a full commit SHA' }
          if ($env:CONSUMER -or $env:PREVIOUS -eq 'true') {
            if ($env:CONSUMER -and $env:CONSUMER -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Wrong extension SHA' }
            if ($env:CANDIDATE_ARTIFACT -cnotmatch '\A[1-9][0-9]*\z' -or
                $env:CANDIDATE_SHA256 -cnotmatch '\A[0-9a-f]{64}\z') { throw 'Incomplete replay pins' }
          } elseif ($env:CANDIDATE_ARTIFACT -or $env:CANDIDATE_SHA256) {
            throw 'Select a replay mode for the candidate artifact'
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: '!inputs.previous_consumers'
        with:
          path: producer
          ref: ${{ inputs.participation_revision }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.participation_consumer != '' && !inputs.previous_consumers
        with:
          repository: Institute-of-Agent-Life/yuki-extensions
          path: consumer
          ref: ${{ inputs.participation_consumer }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: '!inputs.previous_consumers'
      - name: Prepare the fixed Rust toolchain
        if: '!inputs.previous_consumers'
        working-directory: producer
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - name: Plan against the published registry
        if: inputs.participation_consumer == '' && !inputs.previous_consumers
        env:
          REVISION: ${{ inputs.participation_revision }}
          SELF_OPPORTUNITIES: ${{ inputs.self_opportunities }}
        run: |
          $selectionArgs = @('--source', 'producer', '--revision', $env:REVISION,
            '--registry', "$env:RUNNER_TEMP/stable-registry", '--out', 'artifacts/selected-participation')
          if ($env:SELF_OPPORTUNITIES -eq 'true') { $selectionArgs += '--self-opportunities' }
          python -B ci/selected_participation.py @selectionArgs
      - name: Build the restricted Windows Host and SDKs
        if: inputs.participation_consumer == '' && !inputs.previous_consumers
        working-directory: producer
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/selected-participation'
          $registry = Join-Path $env:RUNNER_TEMP 'stable-registry'
          $plan = Join-Path $out 'plan.json'
          python -B ci/promote-surface.py build-sdks --registry $registry --plan $plan --out (Join-Path $out 'sdk')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B ci/promote-surface.py build-host --registry $registry --plan $plan --out (Join-Path $out 'windows') --target-dir (Join-Path $env:RUNNER_TEMP 'selected-target')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.participation_consumer == '' && !inputs.previous_consumers
        with:
          name: selected-participation-windows-${{ github.run_attempt }}
          path: artifacts/selected-participation/
          if-no-files-found: error
          retention-days: 14
      - name: Retrieve the exact successful candidate archive
        if: inputs.participation_consumer != '' || inputs.previous_consumers
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.candidate_artifact }}
        run: |
          @'
          import os
          from pathlib import Path
          import subprocess

          path = Path(os.environ["RUNNER_TEMP"]) / "participation-candidate.zip"
          endpoint = f"repos/Institute-of-Agent-Life/yuki-core/actions/artifacts/{os.environ['ARTIFACT']}/zip"
          with path.open("xb") as output:
              subprocess.run(["gh", "api", endpoint], stdout=output, check=True, timeout=180)
          '@ | python -B -
      - name: Prepare the locked participation library
        if: inputs.participation_consumer != '' && !inputs.previous_consumers
        working-directory: consumer
        run: |
          $pin = Get-Content compat/participation-library/source.lock.json -Raw | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'participation.tar.gz'
          Invoke-WebRequest -Uri $pin.source_url -OutFile $source
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.source_sha256) { throw 'Wrong library' }
          $lock = 'compat/participation-library/replay-requirements.txt'
          $wheels = Join-Path $env:RUNNER_TEMP 'participation-wheels'
          python -m pip download --require-hashes --only-binary=:all: --dest $wheels -r $lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-index --require-hashes --find-links $wheels -r $lock
      - name: Replay the installed participation worker
        if: inputs.participation_consumer != '' && !inputs.previous_consumers
        env:
          REVISION: ${{ inputs.participation_revision }}
          CONSUMER: ${{ inputs.participation_consumer }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SELF_OPPORTUNITIES: ${{ inputs.self_opportunities }}
        run: |
          $replayArgs = @('--extensions', 'consumer', '--extension-revision', $env:CONSUMER,
            '--host-bundle', "$env:RUNNER_TEMP/participation-candidate.zip", '--host-sha256', $env:CANDIDATE_SHA256,
            '--core-revision', $env:REVISION, '--library', "$env:RUNNER_TEMP/participation.tar.gz",
            '--out', 'artifacts/participation-replay')
          if ($env:SELF_OPPORTUNITIES -eq 'true') {
            $prior = Join-Path $env:RUNNER_TEMP 'yuki-participation-0.1.0-windows.zip'
            Invoke-WebRequest -Uri 'https://github.com/Institute-of-Agent-Life/yuki-extensions/releases/download/plugin/participation/v0.1.0/yuki-participation-0.1.0-windows.zip' -OutFile $prior
            $replayArgs += @('--previous-participation', $prior)
          }
          python -B ci/participation_replay.py @replayArgs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && inputs.participation_consumer != '' }}
        with:
          name: participation-replay-windows-${{ github.run_attempt }}
          path: artifacts/participation-replay/
          if-no-files-found: warn
          retention-days: 14
      - name: Replay original released consumers on the same candidate
        if: inputs.previous_consumers
        env:
          REVISION: ${{ inputs.participation_revision }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          python -B ci/previous_selected_replay.py --candidate "$env:RUNNER_TEMP/participation-candidate.zip" --candidate-sha256 $env:CANDIDATE_SHA256 --core-revision $env:REVISION --out artifacts/previous-consumers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && inputs.previous_consumers }}
        with:
          name: previous-consumers-windows-${{ github.run_attempt }}
          path: artifacts/previous-consumers/
          if-no-files-found: warn
          retention-days: 14
