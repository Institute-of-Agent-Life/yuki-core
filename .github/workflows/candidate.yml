name: Candidate host
on:
  workflow_dispatch:
    inputs:
      participation_revision:
        description: Exact source SHA for the Windows participation candidate
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    if: inputs.participation_revision == ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - name: Install the locked toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          cargo fetch --locked
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - run: python ci/check.py CORE-039 --out artifacts/CORE-039/ci
      - run: python ci/candidate_job.py native --manifest artifacts/CORE-039/ci/manifest.json --out artifacts/host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.sha }}-${{ matrix.os }}
          path: artifacts/host/
          if-no-files-found: error
  oci:
    if: inputs.participation_revision == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python ci/candidate_job.py oci --out artifacts/linux-oci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-${{ github.sha }}-linux
          path: |
            artifacts/linux-oci/*.oci.tar
            artifacts/linux-oci/oci-candidate.json*
            artifacts/linux-oci/signer.pub
            artifacts/linux-oci/runtime.log
            artifacts/linux-oci/verify*.py
          if-no-files-found: error
  selected-windows:
    if: inputs.participation_revision != ''
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_INCREMENTAL: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PYTHONUTF8: '1'
    steps:
      - name: Require a full source SHA
        env:
          REVISION: ${{ inputs.participation_revision }}
        run: |
          if ($env:REVISION -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected a full commit SHA' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: producer
          ref: ${{ inputs.participation_revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Prepare the fixed Rust toolchain
        working-directory: producer
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - name: Plan against the published registry
        env:
          REVISION: ${{ inputs.participation_revision }}
        run: |
          python -B ci/selected_participation.py --source producer --revision $env:REVISION --registry "$env:RUNNER_TEMP/stable-registry" --out artifacts/selected-participation
      - name: Build the restricted Windows Host and SDKs
        working-directory: producer
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/selected-participation'
          $registry = Join-Path $env:RUNNER_TEMP 'stable-registry'
          $plan = Join-Path $out 'plan.json'
          python -B ci/promote-surface.py build-sdks --registry $registry --plan $plan --out (Join-Path $out 'sdk')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B ci/promote-surface.py build-host --registry $registry --plan $plan --out (Join-Path $out 'windows') --target-dir (Join-Path $env:RUNNER_TEMP 'selected-target')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-participation-windows-${{ github.run_attempt }}
          path: artifacts/selected-participation/
          if-no-files-found: error
          retention-days: 14
