name: core-check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Retargeting a stacked PR needs a fresh merge checkout. Title/body edits do not.
    if: github.event.action != 'edited' || github.event.changes.base != null
    concurrency:
      group: core-check-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        # Stacked PRs get Linux feedback; changing the base to main runs the full merge gate.
        os: >-
          ${{ fromJSON(github.event_name != 'pull_request' && '["windows-latest","macos-15-intel","ubuntu-latest"]'
              || github.base_ref == 'main' && '["windows-latest","macos-15","ubuntu-latest"]'
              || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install the locked compiler
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependencies for this runner and toolchain
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-workspace-crates: 'false'
          cache-on-failure: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - name: Run all registered cards with two isolated workers
        run: |
          python -m unittest discover -s ci -p test_suite.py
          python ci/suite.py --out artifacts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Retain evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
