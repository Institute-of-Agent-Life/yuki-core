name: core-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Prepare pinned Rust and immutable dependency downloads
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
          cargo fetch --locked --manifest-path sdk/rust/Cargo.toml
      - name: Replay offline harness and reject injected faults
        run: python ci/check.py CORE-001 --out artifacts/CORE-001/ci
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Compare both v4 captures and hash the offline consumer bundle
        run: python ci/check.py CORE-002 --out artifacts/CORE-002/ci
      - name: Inventory a quiesced synthetic multi-owner snapshot
        run: python ci/check.py CORE-003 --out artifacts/CORE-003/ci
      - name: Evaluate QQ key evidence for the target deployment
        run: python ci/check.py CORE-004 --out artifacts/CORE-004/ci
      - name: Verify Rust owner, cleanup barriers and actual binary
        run: python ci/check.py CORE-005 --out artifacts/CORE-005/ci
      - name: Verify original-person merges and current device authorization
        run: python ci/check.py CORE-006 --out artifacts/CORE-006/ci
      - name: Verify dated ownership, transfers and private entries
        run: python ci/check.py CORE-007 --out artifacts/CORE-007/ci
      - name: Check offline provider evidence and the opt-in gate on loopback
        run: python ci/check.py CORE-049 --out artifacts/CORE-049/ci
      - name: Kill and recover the writer at both ingress barriers
        run: python ci/check.py CORE-008 --out artifacts/CORE-008/ci
      - name: Exercise authenticated OneBot peers, routing and private typing
        run: python ci/check.py CORE-009 --out artifacts/CORE-009/ci
      - name: Verify immutable receipts and external dispatch recovery
        run: python ci/check.py CORE-010 --out artifacts/CORE-010/ci
      - name: Install the handshake distributions and test bidirectional stdio peers
        run: python ci/check.py CORE-031 --out artifacts/CORE-031/ci
      - name: Race logical reservations and recover physical model attempts
        run: python ci/check.py CORE-011 --out artifacts/CORE-011/ci
      - name: Restart between source erasure and external holder acknowledgment
        run: python ci/check.py CORE-052 --out artifacts/CORE-052/ci
      - name: Recover native QQ groups with a membership probe and original authority
        run: python ci/check.py CORE-056 --out artifacts/CORE-056/ci
      - name: Exercise the Rust Main runner and physical Chat Completions boundaries
        run: python ci/check.py CORE-012 --out artifacts/CORE-012/ci
      - name: Deliver original QQ parts and recover lost acknowledgments
        run: python ci/check.py CORE-013 --out artifacts/CORE-013/ci
      - name: Replay ordered Responses items with three explicit dialects
        run: python ci/check.py CORE-019 --out artifacts/CORE-019/ci
      - name: Match authorized literal history against the v4 Unicode and OpenCC oracle
        run: python ci/check.py CORE-014 --out artifacts/CORE-014/ci
      - name: Replay frozen native tools, effect barriers and immutable result pages
        run: python ci/check.py CORE-015 --out artifacts/CORE-015/ci
      - name: Exercise installed plugin subprocesses and source-bound receipts
        run: python ci/check.py CORE-032 --out artifacts/CORE-032/ci
      - name: Recover original Work settlement and private child messages
        run: python ci/check.py CORE-016 --out artifacts/CORE-016/ci
      - name: Retain evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
