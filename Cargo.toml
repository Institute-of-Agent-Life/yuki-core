[package]
name = "yuki-core"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "=0.8.6", features = ["ws"] }
clap = { version = "=4.5.50", features = ["derive"] }
jsonschema = { version = "=0.37.1", default-features = false }
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
toml = "=0.9.8"
unicode-normalization = "=0.1.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[build-dependencies]
cc = "=1.11.0"
flate2 = "=1.1.10"
sha2 = "=0.10.9"
tar = "=0.4.46"
