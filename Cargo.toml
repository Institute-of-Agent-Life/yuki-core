[package]
name = "yuki-core"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-only"

[dependencies]
base64 = "=0.22.1"
axum = { version = "=0.8.6", features = ["ws"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
clap = { version = "=4.5.50", features = ["derive"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.3.4"
jsonschema = { version = "=0.37.1", default-features = false }
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process", "fs"] }
toml = "=0.9.8"
unicode-normalization = "=0.1.22"
yuki-plugin-sdk = { version = "1.0.0-alpha.1", path = "sdk/rust" }
toml_edit = { version = "=0.23.7", default-features = false, features = ["parse", "display"] }
sha1 = "=0.10.7"
libsqlite3-sys = { version = "=0.30.1", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[build-dependencies]
cc = "=1.11.0"
flate2 = "=1.1.10"
sha2 = "=0.10.9"
tar = "=0.4.46"
